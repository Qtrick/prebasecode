<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>PreBase Tauri Fixture</title>
	<style>
		body { font: 16px/1.4 system-ui, sans-serif; margin: 24px; }
		label, button { display: block; margin: 12px 0; }
		#status { min-height: 1.5em; }
	</style>
</head>
<body>
	<h1>Tauri fixture</h1>
	<label for="name">Name
		<input id="name" type="text" aria-label="Name" placeholder="Ada">
	</label>
	<button type="button" id="greet">Greet</button>
	<p id="status" role="status" aria-live="polite">Ready</p>
	<script>
		document.getElementById('greet').addEventListener('click', async () => {
			const name = document.getElementById('name').value || 'world';
			console.log('renderer greet', name);
			const status = document.getElementById('status');
			status.dataset.backendInvoke = 'false';
			try {
				if (window.__TAURI__?.core?.invoke) {
					const response = await window.__TAURI__.core.invoke('greet', { name });
					const prefix = 'PREBASE_RUST_INVOKE::';
					if (typeof response === 'string' && response.startsWith(prefix)) {
						status.dataset.backendInvoke = 'true';
						status.textContent = response.slice(prefix.length);
						return;
					}
				}
			} catch (error) {
				status.textContent = `Invoke failed: ${String(error)}`;
				return;
			}
			status.textContent = 'Rust invoke unavailable';
		});
	</script>
</body>
</html>
