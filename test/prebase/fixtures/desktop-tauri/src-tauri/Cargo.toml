[package]
name = "prebase-desktop-tauri-fixture"
version = "0.0.0"
edition = "2021"

[lib]
name = "prebase_desktop_tauri_fixture_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[features]
prebase-testing = ["dep:tauri-plugin-wdio-webdriver"]
