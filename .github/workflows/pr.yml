name: PreBase PR Assurance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  prebase-assurance:
    name: PreBase assurance (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Transpile client (startup gate needs out/)
        run: npm run transpile-client

      - name: Assurance quick + privacy
        run: |
          npm run assurance:quick
          npm run assurance:privacy
